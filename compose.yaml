services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nocturneai
      POSTGRES_USER: nocturneai
      POSTGRES_PASSWORD: nocturneai_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocturneai -d nocturneai"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

